services:
  postgres:
    image: postgres:17
    container_name: yuvon-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: yuvon_db
      POSTGRES_USER: yuvon_user
      POSTGRES_PASSWORD: yuvon_password

    volumes:
      - yuvon-postgres-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U yuvon_user -d yuvon_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - yuvon-network


  redis:
    image: redis:8-alpine
    container_name: yuvon-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - yuvon-network


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: yuvon-backend-container
    restart: unless-stopped

    command:
      python manage.py runserver 0.0.0.0:8000

    environment:
      DEBUG: "True"

      DATABASE_ENGINE: postgresql
      DB_NAME: yuvon_db
      DB_USER: yuvon_user
      DB_PASSWORD: yuvon_password
      DB_HOST: postgres
      DB_PORT: "5432"

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: django-db

      FRONTEND_URL: http://localhost:3000

      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173

      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173

      ALLOWED_HOSTS: localhost,127.0.0.1

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - yuvon-network


  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: yuvon-celery-worker
    restart: unless-stopped

    command:
      celery -A yuvon_backend worker --loglevel=info

    environment:
      DEBUG: "True"

      DATABASE_ENGINE: postgresql
      DB_NAME: yuvon_db
      DB_USER: yuvon_user
      DB_PASSWORD: yuvon_password
      DB_HOST: postgres
      DB_PORT: "5432"

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: django-db

      FRONTEND_URL: http://localhost:3000

      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173

      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173

      ALLOWED_HOSTS: localhost,127.0.0.1

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - yuvon-network


  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: yuvon-celery-beat
    restart: unless-stopped

    command:
      celery -A yuvon_backend beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

    environment:
      DEBUG: "True"

      DATABASE_ENGINE: postgresql
      DB_NAME: yuvon_db
      DB_USER: yuvon_user
      DB_PASSWORD: yuvon_password
      DB_HOST: postgres
      DB_PORT: "5432"

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: django-db

      FRONTEND_URL: http://localhost:3000

      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173

      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173

      ALLOWED_HOSTS: localhost,127.0.0.1

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - yuvon-network


  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile

    container_name: yuvon-frontend-container
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - yuvon-network


volumes:
  yuvon-postgres-data:
    external: true


networks:
  yuvon-network:
    external: true